<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liz, mi universo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: #dfe6ff; }
    canvas { display: block; cursor: grab; }
    canvas:active { cursor: grabbing; }

    .titulo {
      position: fixed;
      top: 24px;
      left: 28px;
      pointer-events: none;
      text-shadow: 0 0 18px rgba(120, 160, 255, .6);
    }
    .titulo h1 { font-size: 42px; font-weight: 300; letter-spacing: 12px; }
    .titulo h1 { color: #ffd6e6; text-shadow: 0 0 22px rgba(255, 90, 150, .8); }
    .titulo p  { font-size: 15px; letter-spacing: 4px; color: #ff9ec2; margin-top: 8px; text-shadow: 0 0 14px rgba(255, 80, 140, .7); }

    .panel {
      position: fixed;
      right: 20px;
      top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px 16px;
      border: 1px solid rgba(140, 170, 255, .25);
      border-radius: 12px;
      background: rgba(10, 14, 35, .55);
      backdrop-filter: blur(6px);
      font-size: 13px;
    }
    .panel label { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .panel input[type=range] { width: 110px; accent-color: #7da2ff; }
    .panel input[type=checkbox] { accent-color: #7da2ff; width: 16px; height: 16px; }
    .panel button {
      margin-top: 4px;
      padding: 7px 10px;
      border: 1px solid rgba(140, 170, 255, .4);
      border-radius: 8px;
      background: rgba(125, 162, 255, .12);
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    .panel button:hover { background: rgba(125, 162, 255, .25); }

    .ayuda {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 16px;
      border-radius: 20px;
      background: rgba(10, 14, 35, .55);
      font-size: 12px;
      letter-spacing: 1px;
      opacity: .75;
      pointer-events: none;
      white-space: nowrap;
    }
    #error {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px;
      font-size: 15px;
      line-height: 1.6;
    }

    @media (max-width: 600px) {
      .titulo h1 { font-size: 20px; letter-spacing: 5px; }
      .titulo { left: 16px; top: 16px; }
      .panel { right: 16px; top: auto; bottom: 64px; }
      .ayuda { font-size: 10px; }
    }
  </style>
</head>
<body>
  <div class="titulo">
    <h1>LIZ</h1>
    <p>TÚ ERES MI UNIVERSO ♥</p>
  </div>

  <div class="panel">
    <label>Rotación automática <input type="checkbox" id="autoRot" checked></label>
    <label>Velocidad <input type="range" id="velocidad" min="0" max="3" step="0.1" value="1"></label>
    <label>Brillo <input type="range" id="brillo" min="0" max="2" step="0.05" value="0.7"></label>
    <button id="reset">Vista inicial</button>
  </div>

  <div class="ayuda">🖱 Arrastra para girar · Rueda para acercar · Clic derecho para desplazar</div>
  <div id="error">No se pudo cargar la animación 3D.<br>Revisa tu conexión a internet (Three.js se carga desde un CDN) y que tu navegador soporte WebGL.</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    /* ---------- Escena, cámara y renderizador ---------- */
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 500);
    const VISTA_INICIAL = new THREE.Vector3(0, 8.5, 7.5);
    camera.position.copy(VISTA_INICIAL);

    // Control con el mouse: girar, acercar y desplazar
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 1.5;
    controls.maxDistance = 60;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.35;

    /* ---------- Material de estrellas (puntos brillantes que titilan) ---------- */
    const pixelRatio = renderer.getPixelRatio();
    function starMaterial(size) {
      return new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uSize: { value: size * pixelRatio },
          uBrillo: { value: 0.7 },
        },
        vertexShader: /* glsl */`
          uniform float uTime;
          uniform float uSize;
          attribute float aScale;
          attribute vec3 aColor;
          varying vec3 vColor;
          void main() {
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            gl_Position = projectionMatrix * mv;
            float titileo = 0.8 + 0.2 * sin(uTime * 2.5 + aScale * 97.0);
            gl_PointSize = uSize * aScale * titileo / -mv.z;
            vColor = aColor;
          }`,
        fragmentShader: /* glsl */`
          uniform float uBrillo;
          varying vec3 vColor;
          void main() {
            float d = distance(gl_PointCoord, vec2(0.5));
            float s = pow(1.0 - smoothstep(0.0, 0.5, d), 3.0);
            gl_FragColor = vec4(vColor * s * uBrillo, 1.0);
          }`,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        transparent: true,
      });
    }
    function pointCloud(positions, colors, scales, material) {
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
      geo.setAttribute('aScale', new THREE.BufferAttribute(scales, 1));
      return new THREE.Points(geo, material);
    }

    // Número aleatorio con distribución normal (más denso en el centro)
    const gauss = () => {
      let u = 0, v = 0;
      while (!u) u = Math.random();
      while (!v) v = Math.random();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    };

    const galaxy = new THREE.Group();
    galaxy.rotation.x = 0.12;
    scene.add(galaxy);
    const materials = [];

    /* ---------- Brazos espirales ---------- */
    {
      const COUNT = 140000, RADIUS = 7, BRANCHES = 4, SPIN = 1.1;
      const inside = new THREE.Color('#ffb36b');
      const middle = new THREE.Color('#ff7aa8');
      const outside = new THREE.Color('#3f74ff');
      const pos = new Float32Array(COUNT * 3), col = new Float32Array(COUNT * 3), sc = new Float32Array(COUNT);
      const c = new THREE.Color();
      for (let i = 0; i < COUNT; i++) {
        const r = 1.8 + Math.pow(Math.random(), 1.4) * (RADIUS - 1.8);   // deja espacio para el corazón
        const branch = (i % BRANCHES) / BRANCHES * Math.PI * 2;
        const spin = r * SPIN;
        const spread = 0.12 + 0.3 * (r / RADIUS);            // los brazos se abren hacia afuera
        const field = Math.random() < 0.18;                   // algunas estrellas sueltas entre los brazos
        const rx = field ? gauss() * 1.6 : gauss() * spread;
        const rz = field ? gauss() * 1.6 : gauss() * spread;
        const ry = gauss() * (0.25 * Math.exp(-r * 0.35) + 0.04) * 2.2; // disco delgado, más grueso al centro
        pos[i * 3]     = Math.cos(branch + spin) * r + rx;
        pos[i * 3 + 1] = ry;
        pos[i * 3 + 2] = Math.sin(branch + spin) * r + rz;

        const t = r / RADIUS;
        if (t < 0.45) c.copy(inside).lerp(middle, t / 0.45);
        else c.copy(middle).lerp(outside, (t - 0.45) / 0.55);
        if (Math.random() < 0.06) c.set('#ffffff');            // algunas estrellas blancas muy brillantes
        col.set([c.r, c.g, c.b], i * 3);
        sc[i] = 0.4 + Math.random() * 1.1;
      }
      const m = starMaterial(28);
      materials.push(m);
      galaxy.add(pointCloud(pos, col, sc, m));
    }

    /* ---------- Corazón central (siempre mira a la cámara y late) ---------- */
    const heart = new THREE.Group();
    scene.add(heart);
    {
      const COUNT = 22000, S = 0.08;
      const pos = new Float32Array(COUNT * 3), col = new Float32Array(COUNT * 3), sc = new Float32Array(COUNT);
      const centro = new THREE.Color('#fff0f5'), rosa = new THREE.Color('#ff6b9d'), rojo = new THREE.Color('#e0004d');
      const c = new THREE.Color();
      // Curva clásica del corazón
      const curva = t => [
        16 * Math.pow(Math.sin(t), 3),
        13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t) + 2.5,
      ];
      const contorno = Array.from({ length: 240 }, (_, i) => curva(i / 240 * Math.PI * 2));
      const dentro = (x, y) => {                                     // punto dentro del contorno
        let inside = false;
        for (let a = 0, b = contorno.length - 1; a < contorno.length; b = a++) {
          const [xa, ya] = contorno[a], [xb, yb] = contorno[b];
          if ((ya > y) !== (yb > y) && x < (xb - xa) * (y - ya) / (yb - ya) + xa) inside = !inside;
        }
        return inside;
      };
      for (let i = 0; i < COUNT; i++) {
        const borde = Math.random() < 0.35;                          // parte de las estrellas dibujan el contorno
        let x, y;
        if (borde) {
          [x, y] = curva(Math.random() * Math.PI * 2);
          x += gauss() * 0.15; y += gauss() * 0.15;
        } else {
          do { x = (Math.random() * 2 - 1) * 16; y = Math.random() * 30 - 15; } while (!dentro(x, y));
        }
        const k = borde ? 1 : Math.min(1, Math.hypot(x, y * 1.1) / 15);
        pos[i * 3]     = x * S;
        pos[i * 3 + 1] = y * S;
        pos[i * 3 + 2] = gauss() * 0.2 * (1.15 - k);                  // volumen: más grueso al centro

        if (k < 0.5) c.copy(centro).lerp(rosa, k / 0.5);
        else c.copy(rosa).lerp(rojo, Math.min(1, (k - 0.5) / 0.5));
        const f = borde ? 1 : 0.75;
        col.set([c.r * f, c.g * f, c.b * f], i * 3);
        sc[i] = (borde ? 0.8 : 0.5) + Math.random() * 0.8;
      }
      const m = starMaterial(30);
      materials.push(m);
      heart.add(pointCloud(pos, col, sc, m));
    }

    /* ---------- Nubes de gas (nebulosas) a lo largo de los brazos ---------- */
    {
      const COUNT = 900, RADIUS = 7, BRANCHES = 4, SPIN = 1.1;
      const pos = new Float32Array(COUNT * 3), col = new Float32Array(COUNT * 3), sc = new Float32Array(COUNT);
      const tones = ['#ff4d8d', '#8a5cff', '#3fa9ff', '#ff8a3d'].map(h => new THREE.Color(h));
      for (let i = 0; i < COUNT; i++) {
        const r = 1 + Math.random() * (RADIUS - 1);
        const a = (i % BRANCHES) / BRANCHES * Math.PI * 2 + r * SPIN + gauss() * 0.12;
        pos[i * 3]     = Math.cos(a) * r + gauss() * 0.3;
        pos[i * 3 + 1] = gauss() * 0.08;
        pos[i * 3 + 2] = Math.sin(a) * r + gauss() * 0.3;
        const c = tones[Math.floor(Math.random() * tones.length)];
        col.set([c.r * 0.06, c.g * 0.06, c.b * 0.06], i * 3);
        sc[i] = 4 + Math.random() * 6;
      }
      const m = starMaterial(30);
      materials.push(m);
      galaxy.add(pointCloud(pos, col, sc, m));
    }

    /* ---------- Resplandor del centro ---------- */
    {
      const cv = document.createElement('canvas');
      cv.width = cv.height = 256;
      const g = cv.getContext('2d');
      const grad = g.createRadialGradient(128, 128, 0, 128, 128, 128);
      grad.addColorStop(0, 'rgba(255,180,210,.8)');
      grad.addColorStop(0.2, 'rgba(255,90,150,.35)');
      grad.addColorStop(0.5, 'rgba(200,40,110,.08)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grad;
      g.fillRect(0, 0, 256, 256);
      const glow = new THREE.Sprite(new THREE.SpriteMaterial({
        map: new THREE.CanvasTexture(cv),
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        transparent: true,
      }));
      glow.scale.set(4.5, 4.5, 1);
      glow.material.opacity = 0.6;
      galaxy.add(glow);
    }

    /* ---------- Estrellas de fondo ---------- */
    {
      const COUNT = 8000;
      const pos = new Float32Array(COUNT * 3), col = new Float32Array(COUNT * 3), sc = new Float32Array(COUNT);
      const c = new THREE.Color();
      for (let i = 0; i < COUNT; i++) {
        const r = 60 + Math.random() * 140;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        pos[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
        pos[i * 3 + 1] = r * Math.cos(phi);
        pos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
        c.setHSL(0.55 + Math.random() * 0.15, 0.4, 0.75 + Math.random() * 0.25);
        col.set([c.r, c.g, c.b], i * 3);
        sc[i] = 0.5 + Math.random() * 1.5;
      }
      const m = starMaterial(260);
      materials.push(m);
      scene.add(pointCloud(pos, col, sc, m));
    }

    /* ---------- Brillo (bloom) ---------- */
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.7, 0.5, 0.15);
    composer.addPass(bloom);

    /* ---------- Panel de controles ---------- */
    let velocidad = 1;
    $('autoRot').addEventListener('change', e => { controls.autoRotate = e.target.checked; });
    $('velocidad').addEventListener('input', e => { velocidad = +e.target.value; });
    $('brillo').addEventListener('input', e => {
      materials.forEach(m => { m.uniforms.uBrillo.value = +e.target.value; });
      bloom.strength = +e.target.value;
    });
    $('reset').addEventListener('click', () => {
      camera.position.copy(VISTA_INICIAL);
      controls.target.set(0, 0, 0);
    });
    function $(id) { return document.getElementById(id); }

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      composer.setSize(innerWidth, innerHeight);
    });

    /* ---------- Animación ---------- */
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const dt = clock.getDelta();
      const t = clock.elapsedTime;
      galaxy.rotation.y -= dt * 0.06 * velocidad;   // la galaxia gira sobre sí misma

      // El corazón siempre mira a la cámara y late (doble latido)
      heart.quaternion.copy(camera.quaternion);
      const fase = (t * 1.1) % 1;
      const latido = Math.exp(-((fase - 0.1) ** 2) / 0.002) + 0.6 * Math.exp(-((fase - 0.3) ** 2) / 0.002);
      heart.scale.setScalar(1 + 0.08 * latido);
      materials.forEach(m => { m.uniforms.uTime.value = t; });
      controls.update();
      composer.render();
    });
  </script>

  <!-- Si el módulo no carga (sin internet o sin WebGL), mostrar aviso -->
  <script>
    setTimeout(() => {
      if (!document.querySelector('canvas')) document.getElementById('error').style.display = 'flex';
    }, 6000);
  </script>
</body>
</html>
